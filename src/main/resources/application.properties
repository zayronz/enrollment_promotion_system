spring.application.name=enrollment_promotion_system-master

# 数据库配置
spring.datasource.url=jdbc:mysql://localhost:3306/enrollment_promotion?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
spring.datasource.username=root
spring.datasource.password=wyx00601
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis-Plus配置
mybatis-plus.mapper-locations=classpath*:/mapper/**/*.xml
mybatis-plus.type-aliases-package=com.wyx.enrollment_promotion_systemmaster.entity
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# Redis配置
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=
spring.redis.database=0

# JWT配置
jwt.secret=EnrollmentPromotionSystemSecretKey2024
jwt.expiration=86400000

# 文件上传配置
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
file.upload.path=D:/enrollment_files/

# 服务器配置
server.port=8080
server.servlet.context-path=/api
